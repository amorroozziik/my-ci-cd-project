name: Auto-merge PR

on:
  pull_request:
    branches: [ main ]
    types: [synchronize, reopened, ready_for_review]

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for required status checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const requiredChecks = ['CI/CD Pipeline / test (pull_request)']; // именно эту проверку ждём

            console.log(`Waiting for checks: ${requiredChecks.join(', ')}`);

            let allPassed = false;
            for (let i = 0; i < 30; i++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha
              });

              const relevantChecks = checks.check_runs.filter(c => requiredChecks.includes(c.name));
              const completed = relevantChecks.every(c => c.status === 'completed');
              const successful = relevantChecks.every(c => c.conclusion === 'success');

              if (completed && successful) {
                allPassed = true;
                console.log('All required checks passed!');
                break;
              }
              console.log(`Waiting... (attempt ${i+1}/30)`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            if (!allPassed) {
              throw new Error('Required checks did not pass within timeout');
            }

      - name: Merge pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'merge'
            });
            console.log('PR merged automatically');
