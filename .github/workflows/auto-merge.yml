name: Auto-merge PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Автоматическое слияние при успешных проверках
        uses: peter-evans/automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: merge
          pull-request: ${{ github.event.pull_request.number }}
          # Слияние только если все проверки успешны
          require-checks: true
          # (необязательно) Слияние только из development в main
          allow-merge: |
            development -> main
