name: Auto-merge PR

on:
  pull_request:
    branches: [ main ]
    types: [ labeled, synchronize, reopened, ready_for_review ]

jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for status checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            let allChecksPassed = false;
            for (let i = 0; i < 30; i++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha
              });
              if (checks.check_runs.every(c => c.status === 'completed' && c.conclusion === 'success')) {
                allChecksPassed = true;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!allChecksPassed) throw new Error('Not all checks passed');
      - name: Merge pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'merge'
            });
